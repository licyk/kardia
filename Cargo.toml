[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/licyk/cordis-rs"
rust-version = "1.85"

[workspace.dependencies]
cordis-core = { path = "crates/cordis-core" }
cordis-macros = { path = "crates/cordis-macros" }
cordis-timer = { path = "crates/cordis-timer" }
cordis-logger-console = { path = "crates/cordis-logger-console" }
cordis-fs = { path = "crates/cordis-fs" }
cordis-loader = { path = "crates/cordis-loader" }
cordis-include = { path = "crates/cordis-include" }
cordis-hmr = { path = "crates/cordis-hmr" }
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
futures = "0.3"
parking_lot = "0.12"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
indexmap = { version = "2", features = ["serde"] }
proptest = "1"
notify = "8"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
trybuild = "1"
globset = "0.4"
saphyr-parser = "0.3"
wasmtime = { version = "34", default-features = false, features = ["cranelift", "runtime", "wat", "std"] }
libloading = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
