[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/licyk/kardia"
rust-version = "1.85"

[workspace.dependencies]
kardia-core = { path = "crates/kardia-core", version = "0.1.0" }
kardia-macros = { path = "crates/kardia-macros", version = "0.1.0" }
kardia-timer = { path = "crates/kardia-timer", version = "0.1.0" }
kardia-logger-console = { path = "crates/kardia-logger-console", version = "0.1.0" }
kardia-fs = { path = "crates/kardia-fs", version = "0.1.0" }
kardia-loader = { path = "crates/kardia-loader", version = "0.1.0" }
kardia-include = { path = "crates/kardia-include", version = "0.1.0" }
kardia-hmr = { path = "crates/kardia-hmr", version = "0.1.0" }
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
futures = "0.3"
parking_lot = "0.12"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
indexmap = { version = "2", features = ["serde"] }
proptest = "1"
notify = "8"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
trybuild = "1"
globset = "0.4"
saphyr-parser = "0.3"
wasmtime = { version = "34", default-features = false, features = ["cranelift", "runtime", "wat", "std"] }
libloading = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
