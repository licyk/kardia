[package]
name = "kardia-server"
description = "Lifecycle-owned HTTP and WebSocket server for kardia"
version = "0.8.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kardia-core.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
thiserror.workspace = true
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
url = "2"
percent-encoding = "2"
regress = { version = "0.12", features = ["utf16"] }
multer = "3.1"
ryu-js = "1.0.3"
tokio-tungstenite = "0.30"

[dev-dependencies]
kardia-loader.workspace = true
kardia-fs.workspace = true
kardia-http = { path = "../kardia-http" }
rcgen = "0.14"
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
