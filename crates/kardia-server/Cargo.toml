[package]
name = "kardia-server"
description = "Lifecycle-owned HTTP and WebSocket server for kardia"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kardia-core.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
url = "2"
percent-encoding = "2"
regress = "0.12"

[dev-dependencies]
kardia-loader.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
