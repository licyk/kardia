[package]
name = "kardia-include"
description = "YAML/JSON config files for kardia's loader, kept in sync both ways"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kardia-core.workspace = true
kardia-loader = { workspace = true, features = ["preserve-order"] }
kardia-fs.workspace = true
tokio.workspace = true
futures.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
indexmap.workspace = true
saphyr-parser.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true
