# A guest plugin written with kardia-guest, built by `tests/rust_guest.rs`
# as a dynamic library, an executable or (for wasm32) a WASM module.
[package]
name = "rust-guest"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# the same guest as a process
[[bin]]
name = "rust-guest-process"
path = "src/main.rs"

# a guest speaking protocol version 1 by hand, as guests built with kardia-guest 0.2.0 do
[[bin]]
name = "rust-guest-v1"
path = "src/v1.rs"

[dependencies]
kardia-guest = { path = "../../../../kardia-guest" }
serde_json = "1"

[features]
v2 = []

[workspace]
