[package]
name = "kardia-hmr"
description = "Hot module replacement for kardia, with WASM, dylib and process guest backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["wasm", "dylib", "process", "preserve-order"]
wasm = ["dep:wasmtime"]
dylib = ["dep:libloading"]
process = []
# kardia-loader's insertion-ordered option maps; an embedder that leaves it off keeps serde_json's default maps
preserve-order = ["kardia-loader/preserve-order"]

[dependencies]
kardia-core.workspace = true
kardia-loader.workspace = true
kardia-fs.workspace = true
tokio.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
wasmtime = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

# the dylib backend needs `unsafe` for dlopen and its C ABI; the rest of the
# crate stays safe
[lints.rust]
unsafe_code = "deny"
