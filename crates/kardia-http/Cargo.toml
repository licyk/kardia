[package]
name = "kardia-http"
description = "Lifecycle-owned HTTP and WebSocket client service for kardia"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kardia-core.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bytes = "1"
http = "1"
hyper = "1"
url = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "deflate", "brotli", "zstd"] }

[dev-dependencies]
kardia-server.workspace = true
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
flate2 = "1"

[lints]
workspace = true
