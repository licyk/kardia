# The Rust workspace's checks. The documentation site (site.yml) and the npm packages under js/ (js.yml) have their own
# workflows, and a change only to files no Rust check reads (the site, js/, Markdown, licence and hosting files) runs
# nothing here. Tags never start this workflow: a v* tag starts Release, which reuses this workflow's run of the tagged
# commit, or calls this file as its checks when there is none.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/site.yml"
      - "js/**"
      - ".github/workflows/js.yml"
      - ".github/workflows/npm-release.yml"
      - "**.md"
      - "LICENSE"
      - "NOTICE"
      - "netlify.toml"
      - "wrangler.toml"
  pull_request:
    paths-ignore:
      - "site/**"
      - ".github/workflows/site.yml"
      - "js/**"
      - ".github/workflows/js.yml"
      - ".github/workflows/npm-release.yml"
      - "**.md"
      - "LICENSE"
      - "NOTICE"
      - "netlify.toml"
      - "wrangler.toml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push cancels an older run of the same ref. Inside Release, github.workflow is "Release", so Release's call
# never shares a group with (or cancels) a CI run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      # pinned: the compile-error snapshots of kardia-macros depend on the compiler version
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          # the rust guest test also builds its fixture as a WASM module
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Architecture (lib.rs / mod.rs only declare and re-export modules)
        run: cargo xtask arch
      - run: cargo test --workspace
      # kardia-hmr's embedders may leave serde_json's preserve_order off: kardia-loader without it, and kardia-hmr
      # without its default features (its test suites need the wasm and dylib backends)
      - run: cargo clippy -p kardia-loader --no-default-features --all-targets -- -D warnings
      - run: cargo test -p kardia-loader --no-default-features
      - run: cargo clippy -p kardia-hmr --no-default-features --features process -- -D warnings
