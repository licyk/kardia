name: Publish

on:
  push:
    tags: ["v*"]
  # resumes a release that stopped part-way
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pinned: the compile-error snapshots of kardia-macros depend on the compiler version
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Publishes every crate version that crates.io does not have yet, in
          # dependency order. crates.io lets an account create only a few new
          # crates at once and then one every ten minutes, so a first release
          # waits out that limit.
          for attempt in 1 2 3 4 5 6 7 8; do
            exclude=()
            pending=0
            for package in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | "\(.name)@\(.version)"'); do
              if curl -sf -A "kardia release workflow" "https://crates.io/api/v1/crates/${package%@*}/${package#*@}" > /dev/null; then
                exclude+=(--exclude "${package%@*}")
              else
                pending=$((pending + 1))
              fi
            done
            if [ "$pending" -eq 0 ]; then
              exit 0
            fi
            if cargo publish --workspace "${exclude[@]}" 2>&1 | tee publish.log; then
              exit 0
            fi
            grep -q "429 Too Many Requests" publish.log || exit 1
            sleep 610
          done
          exit 1
